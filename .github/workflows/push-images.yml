name: Push lab images to ECR

# Manual trigger only. Run it from the Actions tab after terraform apply.
on:
  workflow_dispatch:

# Required so the job can request a GitHub OIDC token and exchange it for
# short-lived AWS credentials. No access keys are stored anywhere.
permissions:
  id-token: write
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository variables are set
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$REGION" ]; then
            echo "::error::Set the AWS_ROLE_ARN and AWS_REGION repository variables first. See the README, section on GitHub Actions."
            exit 1
          fi

      # TEMPORARY: remove after the OIDC issue is diagnosed.
      - name: Debug OIDC claims (temporary)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, ref, repository}'

      - name: Assume the lab IAM role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Reuses the same script as the local option, so the image list lives in one place.
      - name: Pull outdated images and push them to ECR
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'inspector-lab' }}
        run: bash scripts/push-images.sh